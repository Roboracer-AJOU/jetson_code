# AMCL — tight snap for F1Tenth loop track.
# Requires /scan_amcl (scan_range_filter caps range — opposite wall causes all-axis drift).
# vesc_wheel_odom publish_on_imu=true for scan/TF time sync.

amcl:
  ros__parameters:
    use_sim_time: false

    base_frame_id: base_link
    global_frame_id: map
    odom_frame_id: odom

    scan_topic: scan_amcl
    map_topic: map
    first_map_only: true

    laser_model_type: likelihood_field
    laser_max_range: 8.0
    laser_min_range: 0.12
    max_beams: 360
    laser_likelihood_max_dist: 0.18
    sigma_hit: 0.05
    z_hit: 0.92
    z_rand: 0.08
    z_max: 0.0
    z_short: 0.0
    lambda_short: 0.1
    do_beamskip: false

    update_min_d: 0.01
    update_min_a: 0.01

    robot_model_type: nav2_amcl::DifferentialMotionModel
    alpha1: 0.08
    alpha2: 0.06
    alpha3: 0.22
    alpha4: 0.14
    alpha5: 0.0

    min_particles: 1500
    max_particles: 6000
    pf_err: 0.02
    pf_z: 0.99
    recovery_alpha_fast: 0.0
    recovery_alpha_slow: 0.0
    resample_interval: 1
    random_seed: -1

    tf_broadcast: true
    transform_tolerance: 0.08
    save_pose_rate: 20.0

    set_initial_pose: false
    always_reset_initial_pose: false
